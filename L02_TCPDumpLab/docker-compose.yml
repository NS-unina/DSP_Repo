version: '2'
services:
  router:
    image: nsunina/hacking-ssh-server:1.0
    stdin_open: true
    tty: true
    networks:
      internal_network:
        ipv4_address: 192.168.2.2
      telnet_network:
        ipv4_address: 192.168.1.2
    cap_add:
      - ALL
  TelnetServer:
    image: nsunina/hacking-ssh-server:1.0
    stdin_open: true
    tty: true
    networks:
      telnet_network:
        ipv4_address: 192.168.1.3
    environment:
      - GATEWAY=192.168.1.2
    cap_add:
      - ALL
  telnet_client:
    image: nsunina/hacking-ssh-server:1.0
    stdin_open: true
    tty: true
    networks:
      internal_network:
        ipv4_address: 192.168.2.4
    environment:
      - GATEWAY=192.168.2.2
    cap_add:
      - ALL
  scapy:
    image: nsunina/hacking-ssh-server:1.0
    stdin_open: true
    tty: true
    networks:
      internal_network:
        ipv4_address: 192.168.2.5
    environment:
      - GATEWAY=192.168.2.2
    cap_add:
      - ALL
networks:
  telnet_network:
    ipam:
      config:
        - subnet: 192.168.1.0/24
  internal_network:
    ipam:
      config:
        - subnet: 192.168.2.0/24
