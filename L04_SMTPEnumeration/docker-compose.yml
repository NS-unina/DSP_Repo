version: '2'
services:
  SMPT_server:
    image: nsunina/postfix:1.0
    stdin_open: true
    tty: true
    networks:
      public_network:
        ipv4_address: 193.21.1.3
  hacking-smtp:
    image: nsunina/hacking-smtp:1.0
    stdin_open: true
    tty: true
    networks:
      public_network: {}
networks:
  public_network:
    ipam:
      config:
        - subnet: 193.21.1.0/24
